[package]
name = "md-env-c"
version.workspace = true
edition.workspace = true
license.workspace = true

# A C shared library for Python's ctypes (python/megadrive_env), and an rlib
# so the crate's own tests can call the functions.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
md-env.workspace = true
md-core.workspace = true
