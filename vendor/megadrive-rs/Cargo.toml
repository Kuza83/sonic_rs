[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
m68k = { path = "crates/m68k" }
vdp = { path = "crates/vdp" }
z80 = { path = "crates/z80" }
psg = { path = "crates/psg" }
ym2612 = { path = "crates/ym2612" }
md-core = { path = "crates/md-core" }
md-env = { path = "crates/md-env" }
md-env-c = { path = "crates/md-env-c" }
savestate = { path = "crates/savestate" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
png = "0.17"
sdl2 = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Whole-program optimisation: lets the compiler inline across the
# emulator crates (e.g. Ym2612::clock, called 1.28 million times a second
# from md-core). Same results; slower release builds.
[profile.release]
lto = "fat"
codegen-units = 1
